monitoring:
  interval_seconds: 5
  failure_threshold: 3          # Consecutive failures before event is raised
  recovery_threshold: 3         # Consecutive successes before recovery is declared
  ping_count: 5                 # Pings per measurement (5+ = aussagekraeftigerer Paketverlust)
  ping_timeout_seconds: 2         # kurzer Timeout: nicht erreichbare Ziele blockieren den Zyklus nicht
  dns_timeout_seconds: 2
  traceroute_on_failure: true
  mtr_on_failure: true
  traceroute_repeat_interval: 60  # Seconds between repeated traceroutes during outage

targets:
  local:
    - name: "Gateway"
      host: "auto"              # auto = detect from routing table
      type: "gateway"
    # Tests ONLY the local resolver (AdGuard/Pi-hole/etc.) — `nameserver` is
    # WHO gets asked (point this at its LAN IP if it doesn't run on the same
    # host as NetWatch), `host` is a real, always-resolvable domain used as
    # the query (an IP literal here would always fail with NXDOMAIN — a
    # resolver can't return an A record for the "domain name" 127.0.0.1).
    # This is a self-diagnostic, kept deliberately separate from the
    # public_domains checks below: if this target fails while those keep
    # working (they don't depend on it), that proves the local resolver —
    # not the ISP — is the cause, and the classifier will not raise
    # DNS_FAILURE from this alone.
    - name: "Lokaler Resolver (AdGuard)"
      host: "cloudflare.com"
      type: "dns"
      nameserver: "127.0.0.1"
  public_ip:
    - name: "Cloudflare DNS"
      host: "1.1.1.1"
      type: "icmp"
    - name: "Google DNS"
      host: "8.8.8.8"
      type: "icmp"
    - name: "Quad9 DNS"
      host: "9.9.9.9"
      type: "icmp"
  # Each target below sets an explicit `nameserver` — the hostname is
  # resolved by querying that IP directly, bypassing whatever resolver is
  # configured on this system (AdGuard, Pi-hole, the ISP's own resolver via
  # DHCP, etc). This is what makes DNS_FAILURE evidence hold up against a
  # provider claiming "that's your own DNS setup, not us": these checks
  # never touch your local resolver at all. Nameservers are deliberately
  # spread across three unrelated operators so a single resolver's own
  # outage can't be mistaken for an ISP failure either.
  public_domains:
    - name: "Google"
      host: "google.com"
      type: "dns"
      nameserver: "1.1.1.1"     # Cloudflare
    - name: "Cloudflare"
      host: "cloudflare.com"
      type: "dns"
      nameserver: "8.8.8.8"     # Google
    - name: "GitHub"
      host: "github.com"
      type: "dns"
      nameserver: "9.9.9.9"     # Quad9
    - name: "Wikipedia"
      host: "wikipedia.org"
      type: "dns"
      nameserver: "1.1.1.1"     # Cloudflare

thresholds:
  latency_warning_ms: 100
  latency_critical_ms: 500
  packet_loss_warning_percent: 5
  packet_loss_critical_percent: 20
  jitter_warning_ms: 50
  dns_resolution_warning_ms: 200
  min_affected_targets: 2       # Event erst, wenn >=2 Ziele gleichzeitig betroffen (1 = altes Verhalten)

public_ip:
  check_interval_seconds: 300
  providers:
    - "https://api.ipify.org?format=json"
    - "https://api64.ipify.org?format=json"
  ipv6_providers:
    - "https://api6.ipify.org?format=json"

speedtest:
  enabled: true
  interval_seconds: 900   # every 15 minutes — real download/upload throughput test
  timeout_seconds: 30

fritzbox:
  enabled: true
  # Router type: "fritzbox" (full DSL diagnostics: sync, SNR, attenuation,
  # event log) | "generic_tr064" (experimental, sync rate only, for non-AVM
  # routers that speak TR-064) | "none" (speedtest-only, no router readout).
  vendor: "fritzbox"
  host: "192.168.178.1"
  timeout_seconds: 8
  # Flag suspected throttling when measured download drops below this
  # fraction of the FritzBox-negotiated sync rate (0.5 = below 50% of line).
  throttle_ratio_threshold: 0.5
  # Credentials for extended DSL diagnostics (SNR, attenuation, max rate).
  # Leave password empty to skip the authenticated DSL readout.
  username: "dslf-config"
  password: ""
  # Contracted line speed in Mbit/s for the contract-vs-actual comparison.
  # Vertragswerte aus dem Produktinformationsblatt / der Vertragszusammenfassung.
  # Regulatoren (z.B. DE Bundesnetzagentur) bewerten drei Werte. 0 = nicht gesetzt.
  contract_download_mbps: 0            # MAXIMUM Download in Mbit/s (0 = Vergleich aus)
  contract_upload_mbps: 0              # MAXIMUM Upload in Mbit/s
  contract_normal_download_mbps: 0     # "normalerweise zur Verfuegung stehend" Download
  contract_min_download_mbps: 0        # Minimum Download
  contract_normal_upload_mbps: 0       # "normalerweise zur Verfuegung stehend" Upload
  contract_min_upload_mbps: 0          # Minimum Upload

database:
  path: "database/netwatch.db"
  wal_mode: true
  vacuum_interval_days: 7

logging:
  level: "INFO"
  max_bytes: 10485760    # 10 MB
  backup_count: 10

dashboard:
  host: "0.0.0.0"
  port: 8080
  debug: false

reports:
  output_dir: "reports"
  auto_generate: true
  generate_time: "06:00"   # HH:MM

notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    from_addr: ""
    to_addr: ""
    use_tls: true
